server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: video-platform-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:videoplatform}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email

  session:
    timeout: 7200

server.servlet.session:
  cookie:
    http-only: true
    same-site: lax
    secure: false
    max-age: 7200

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  livekit:
    url: ${LIVEKIT_API_URL:http://localhost:7880}
    api-key: ${LIVEKIT_API_KEY:devkey}
    api-secret: ${LIVEKIT_API_SECRET:secretsecretsecretsecretsecretsecret32}
  admin:
    bootstrap-enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    bootstrap-google-id: ${ADMIN_BOOTSTRAP_GOOGLE_ID:}
