services:
  # 1. Spring Boot Backend API
  - type: web
    name: love-video-api
    runtime: docker
    dockerfilePath: api/Dockerfile
    dockerContext: api
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        fromDatabase:
          name: love-video-db
          property: connectionString
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: love-video-web
          property: host

  # 2. React + Vite Frontend
  - type: web
    name: love-video-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: oregon
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: love-video-api
          property: host

# 3. Managed PostgreSQL Database
databases:
  - name: love-video-db
    plan: free
    region: oregon
